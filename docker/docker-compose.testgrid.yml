# Salyyy MinecraftKit — Hybrid Resource-Governed Off-Screen Bot Test Grid
# Runs 8 lightweight Tier-1 headless protocol bots (~336 MB total) + 1 Tier-2
# off-screen Xvfb visual client (~1.4 GB) = < 2 GB total vs ~24 GB for 9 desktop tabs!
services:
  mckit-protocol-pool:
    build:
      context: ..
      dockerfile: docker/Dockerfile.protocol-bot
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MC_HOST=${MC_HOST:-host.docker.internal}
      - MC_PORT=${MC_PORT:-25565}
      - MC_VERSION=${MC_VERSION:-1.21.4}
      - BOT_POOL_SIZE=${BOT_POOL_SIZE:-8}
      - BOT_STAGGER_MS=${BOT_STAGGER_MS:-750}
      - BOT_MAX_RAM_MB=${BOT_MAX_RAM_MB:-512}
      - BOT_AUTH_PASSWORD=${MCKIT_BOT_PASSWORD:-}
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cpus: 1.5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.50'
    volumes:
      - ../artifacts/bot-reports:/app/reports
    restart: 'no'

  mckit-visual-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.visual-bot
    init: true
    shm_size: '512m'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DISPLAY=:99
      - XVFB_WHD=1280x720x24
      - MC_HOST=${MC_HOST:-host.docker.internal}
      - MC_PORT=${MC_PORT:-25565}
      - CAPTURE_FPS=2
      - CAPTURE_DURATION_SEC=${CAPTURE_DURATION_SEC:-20}
      - CAPTURE_EMIT_GIF=${CAPTURE_EMIT_GIF:-1}
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe
    mem_limit: 2048m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 2048m
          cpus: '2.00'
    volumes:
      - ../artifacts/visual-captures:/app/captures
    restart: 'no'
