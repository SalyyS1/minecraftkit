name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Validate Catalogs, Python MCP & Node CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate kit catalogs and release payload invariants
        run: python3 scripts/validate_kit.py

      - name: Run Python unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run Node CLI & bootstrap sync checks
        run: npm --prefix npm run check
